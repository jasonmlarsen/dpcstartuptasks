<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — Launch Tasks: settings, members, invite acceptance</title>
<!--
  THROWAWAY PROTOTYPE. Not production code. Answers wayfinder ticket #17:
  "Secondary screens: practice settings, member management, and the
  invite-acceptance flow".

  Three structurally different takes on the same set of screens, switchable
  via ?variant=A|B|C and the floating bottom bar. Extends the visual language
  settled in #3 (prototype/task-list-screen) — same appbar, same tokens, same
  card and pill idiom — rather than restarting it.

  The bottom bar also carries the CASE TOGGLES, which are the real point:
  every hard case three closed tickets piled onto these screens is reachable
  without editing code — no consent / consent granted / suppressed, 1 / 2 / 3
  seats, Owner / Member, and six ways an invite link can be opened.

  "Notes" turns on dashed annotations explaining what each choice commits to.
  State is in memory only. Refresh resets.
-->
<link rel="stylesheet" href="../../../styles/design-tokens.css" />
<style>
  body { background: var(--gray-50); color: var(--gray-800); padding-bottom: 9rem; }
  .wrap { max-width: var(--container-width); margin: 0 auto; padding: var(--space-6) var(--space-4); }
  .wrap.narrow { max-width: 48rem; }
  h1,h2,h3,h4 { color: var(--gray-900); line-height: 1.3; }
  a { color: var(--primary-dark); }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font: inherit; }

  /* --- shared app chrome, identical in every variant (from #3) --- */
  .appbar { background: var(--white); border-bottom: 1px solid var(--gray-200); position: sticky; top: 0; z-index: 20; }
  .appbar .wrap { display: flex; align-items: center; gap: var(--space-4); padding-top: var(--space-4); padding-bottom: var(--space-4); }
  .brand { font-weight: 700; color: var(--gray-900); letter-spacing: -0.01em; }
  .brand span { color: var(--primary); }
  .navlink { margin-left: auto; font-size: .875rem; color: var(--gray-500); text-decoration: none; }
  .practice { color: var(--gray-500); font-size: 0.875rem; }

  .muted { color: var(--gray-500); }
  .tiny { font-size: .8125rem; }
  .pill { display: inline-flex; align-items: center; gap: var(--space-1); font-size: 0.75rem; font-weight: 600;
          padding: 0.15rem var(--space-2); border-radius: var(--radius-sm); }
  .pill-owner { background: #eff6ff; color: var(--primary-dark); }
  .pill-pending { background: var(--gray-100); color: var(--gray-500); }
  .pill-you { background: #ecfeff; color: var(--secondary-dark); }

  .btn { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-5);
         border-radius: var(--radius-md); font-weight: 600; font-size: .9375rem; }
  .btn-primary { background: var(--primary); color: var(--white); box-shadow: var(--shadow-sm); }
  .btn-ghost { background: var(--gray-100); color: var(--gray-700); }
  .btn-quiet { color: var(--gray-500); padding: var(--space-2) 0; font-weight: 600; font-size: .875rem; text-decoration: underline; }
  .btn-danger { color: var(--error); background: #fef2f2; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn-sm { padding: var(--space-2) var(--space-3); font-size: .8125rem; }

  .field { width: 100%; border: 1px solid var(--gray-300); border-radius: var(--radius-md);
           padding: var(--space-3); background: var(--white); font-size: .9375rem; }
  .field:focus-visible { outline: 2px solid var(--primary); outline-offset: 0; border-color: var(--primary); }

  .avatar { width: 2.5rem; height: 2.5rem; border-radius: 999px; display: grid; place-items: center; flex: none;
            background: #eff6ff; color: var(--primary-dark); font-weight: 700; font-size: .875rem; }
  .avatar.pending { background: var(--gray-100); color: var(--gray-400); border: 1px dashed var(--gray-300); }

  /* honest-absence blocks, shared */
  .explain { background: #fff7ed; border-left: 3px solid var(--accent); border-radius: var(--radius-sm);
             padding: var(--space-4); font-size: .9375rem; color: var(--gray-700); line-height: 1.6; }
  .explain strong { color: var(--accent-dark); }
  .ok { background: #ecfdf5; border-left: 3px solid var(--success); border-radius: var(--radius-sm);
        padding: var(--space-4); font-size: .9375rem; line-height: 1.6; }

  /* ---------- VARIANT A: one page, plain sections ---------- */
  .a-sec { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-lg);
           padding: var(--space-6); margin-bottom: var(--space-4); }
  .a-sec > h2 { font-size: 1.0625rem; margin-bottom: var(--space-1); }
  .a-sec > .lede { color: var(--gray-500); font-size: .875rem; margin-bottom: var(--space-5); }
  .a-row { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) 0;
           border-top: 1px solid var(--gray-100); }
  .a-row:first-of-type { border-top: none; }
  .a-row .grow { flex: 1; min-width: 0; }
  .a-row .nm { font-weight: 600; color: var(--gray-900); font-size: .9375rem; }
  .a-row .em { font-size: .8125rem; color: var(--gray-500); word-break: break-all; }
  .a-invite { display: flex; gap: var(--space-3); margin-top: var(--space-5); }
  .a-invite .field { flex: 1; }
  .a-foot { text-align: center; padding: var(--space-6) 0 var(--space-10); }

  /* ---------- VARIANT B: settings console, tabbed ---------- */
  .b-grid { display: grid; grid-template-columns: 14rem 1fr; gap: var(--space-8); align-items: start; }
  .b-nav { position: sticky; top: 5.5rem; display: flex; flex-direction: column; gap: 2px; }
  .b-nav button { text-align: left; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
                  font-size: .9375rem; color: var(--gray-600); }
  .b-nav button:hover { background: var(--gray-100); }
  .b-nav button[aria-current="true"] { background: var(--white); color: var(--gray-900); font-weight: 700;
                                       box-shadow: var(--shadow-sm); }
  .b-panel { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: var(--space-6); }
  .b-panel h2 { font-size: 1.25rem; margin-bottom: var(--space-5); }
  .b-table { width: 100%; border-collapse: collapse; font-size: .875rem; }
  .b-table th { text-align: left; font-size: .6875rem; text-transform: uppercase; letter-spacing: .08em;
                color: var(--gray-400); padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--gray-200); }
  .b-table td { padding: var(--space-3); border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
  .b-table td:last-child { text-align: right; }
  .b-kv { display: grid; grid-template-columns: 11rem 1fr; gap: var(--space-3) var(--space-4); font-size: .9375rem; align-items: center; }
  .b-kv dt { color: var(--gray-500); font-size: .875rem; }
  .b-kv dd { color: var(--gray-900); }
  .b-seats { font-variant-numeric: tabular-nums; color: var(--gray-500); font-size: .8125rem; }

  /* ---------- VARIANT C: "your practice", written in sentences ---------- */
  .c-head { margin-bottom: var(--space-8); }
  .c-head h1 { font-size: 2rem; letter-spacing: -0.02em; }
  .c-head p { color: var(--gray-500); margin-top: var(--space-2); font-size: 1.0625rem; }
  .c-para { font-size: 1.0625rem; line-height: 1.75; color: var(--gray-700); margin-bottom: var(--space-4); }
  .c-para b { color: var(--gray-900); }
  .c-block { margin-bottom: var(--space-10); }
  .c-block > h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--gray-400);
                  margin-bottom: var(--space-4); }
  .c-people { display: grid; gap: var(--space-3); }
  .c-person { display: flex; align-items: center; gap: var(--space-4); background: var(--white);
              border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); }
  .c-person.pending { border-style: dashed; background: transparent; }
  .c-person .grow { flex: 1; min-width: 0; }
  .c-quiet { border-top: 1px solid var(--gray-200); margin-top: var(--space-12); padding-top: var(--space-6);
             display: flex; flex-wrap: wrap; gap: var(--space-6); font-size: .875rem; }
  .c-quiet a, .c-quiet button { color: var(--gray-500); text-decoration: underline; }

  /* ---------- invite acceptance (all variants) ---------- */
  .inv-shell { min-height: 78vh; display: grid; place-items: center; padding: var(--space-6) var(--space-4); }
  .inv-card { background: var(--white); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);
              padding: var(--space-8); max-width: 34rem; width: 100%; }
  .inv-card h1 { font-size: 1.5rem; margin-bottom: var(--space-3); }
  .inv-card p { line-height: 1.7; margin-bottom: var(--space-4); }
  .inv-brand { font-weight: 700; color: var(--gray-900); margin-bottom: var(--space-6); }
  .inv-brand span { color: var(--primary); }
  .inv-who { display: flex; align-items: center; gap: var(--space-3); background: var(--gray-50);
             border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-5); }
  .inv-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-6); }
  .inv-card .btn-primary { background: var(--success); }

  /* mocked email, shown under Notes */
  .mail { border: 1px solid var(--gray-200); border-radius: var(--radius-lg); background: var(--white);
          margin-top: var(--space-6); overflow: hidden; max-width: 34rem; }
  .mail header { background: var(--gray-50); border-bottom: 1px solid var(--gray-200); padding: var(--space-3) var(--space-4);
                 font-size: .75rem; color: var(--gray-500); }
  .mail .mbody { padding: var(--space-5); font-size: .9375rem; line-height: 1.7; }

  /* ---------- prototype annotations (deliberately not part of the design) ---------- */
  .pnote { border: 1px dashed var(--accent); border-radius: var(--radius-sm); background: #fffbeb;
           color: #92400e; font-family: var(--font-mono); font-size: .75rem; line-height: 1.6;
           padding: var(--space-2) var(--space-3); margin: var(--space-3) 0; }
  .pnote b { color: #78350f; }

  /* ---------- prototype chrome (deliberately ugly) ---------- */
  #chrome { position: fixed; bottom: 0; left: 0; right: 0; z-index: 999; background: var(--gray-900); color: var(--white);
            box-shadow: var(--shadow-xl); padding: var(--space-2) var(--space-3);
            padding-bottom: calc(var(--space-2) + env(safe-area-inset-bottom)); font-size: .75rem; }
  #chrome .line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
                  justify-content: center; max-width: var(--container-width); margin: 0 auto; }
  #chrome .line + .line { margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px solid var(--gray-700); }
  #chrome button { color: var(--white); padding: .2rem var(--space-2); border-radius: var(--radius-sm); }
  #chrome button[aria-pressed="true"] { background: var(--primary); }
  #chrome .lbl { min-width: 15rem; text-align: center; font-weight: 700; }
  #chrome .cap { color: var(--gray-400); text-transform: uppercase; letter-spacing: .06em; font-size: .6875rem; }
  #chrome select { background: var(--gray-800); color: var(--white); border: 1px solid var(--gray-600);
                   border-radius: var(--radius-sm); padding: .2rem; font-size: .75rem; }

  @media (max-width: 800px) {
    .b-grid { grid-template-columns: 1fr; }
    .b-nav { position: static; flex-direction: row; overflow-x: auto; gap: var(--space-2); padding-bottom: var(--space-2); }
    .b-nav button { white-space: nowrap; }
    .b-kv { grid-template-columns: 1fr; gap: var(--space-1); }
    .b-kv dd { margin-bottom: var(--space-3); }
    .a-invite { flex-direction: column; }
    .inv-card { padding: var(--space-6); }
    #chrome .lbl { min-width: 8rem; }
    body { padding-bottom: 12rem; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="chrome"></div>
<script>
/* ============================ state ============================ */
const VARIANTS = {
  A: 'One page, plain sections',
  B: 'Settings console, tabbed',
  C: 'Your practice, in sentences',
};
const SCREENS = { settings: 'Settings', invite: 'Invite acceptance' };
const params = new URLSearchParams(location.search);

const S = {
  variant: (params.get('variant') || 'A').toUpperCase(),
  screen: params.get('screen') || 'settings',
  role: 'owner',            // owner | member
  consent: 'none',          // none | granted | suppressed
  seats: 2,                 // people attached to the practice, incl. pending invites
  tab: 'practice',          // variant B only
  notes: false,
  invite: 'fresh',          // see INVITE_CASES
  flash: null,              // transient message
};
if (!VARIANTS[S.variant]) S.variant = 'A';

const INVITE_CASES = {
  fresh:        'Signed out, link is good',
  signedin_own: 'Signed in, own practice is empty',
  signedin_busy:'Signed in, own practice has work in it',
  used:         'Link already accepted',
  revoked:      'Invite was withdrawn',
  full:         'Practice filled up in the meantime',
  expired:      'Link is 40 days old',
};

const PRACTICE = { name: 'Cascade Family Direct Care', state: 'Oregon', created: '12 January 2026' };
const OWNER   = { name: 'Dr. Aisha Reyes',  email: 'a.reyes@cascadefdc.com',  since: 'Started this practice 12 Jan 2026', role: 'Owner' };
const PEOPLE  = [
  { name: 'Dr. Marcus Patel', email: 'm.patel@cascadefdc.com', since: 'Joined 3 Mar 2026', role: 'Member' },
  { name: null,               email: 'jordan.lee@northwoodclinic.com', since: 'Invited 14 Sep 2026', role: 'Member', pending: true },
];
const INVITER = OWNER.name;

/* ============================ helpers ============================ */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const roster = () => [OWNER, ...PEOPLE.slice(0, Math.max(S.seats, S.role === 'member' ? 2 : 1) - 1)];
const seatsUsed = () => roster().length;
const atCap = () => seatsUsed() >= 3;
const isOwner = () => S.role === 'owner';
const me = () => isOwner() ? OWNER : PEOPLE[0];
const initials = p => p.name ? p.name.replace(/^Dr\.\s*/, '').split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase() : '?';
const note = (t) => S.notes ? '<div class="pnote">' + t + '</div>' : '';
const RESUB = 'https://directcaretools.kit.com/resubscribe';

function flash(msg) { S.flash = msg; render(); clearTimeout(flash.t); flash.t = setTimeout(() => { S.flash = null; render(); }, 4000); }

function appbar(extra) {
  return '<div class="appbar"><div class="wrap">' +
    '<div class="brand">Launch<span>Tasks</span></div>' +
    '<div class="practice">' + esc(PRACTICE.name) + ' &middot; ' + esc(me().name || me().email) + '</div>' +
    '<a class="navlink" href="#" style="margin-left:var(--space-6)">&larr; Back to your list</a>' +
    '</div></div>' + (extra || '');
}

function flashBar() {
  return S.flash ? '<div class="wrap" style="padding-bottom:0"><div class="ok">' + esc(S.flash) + '</div></div>' : '';
}

/* ---- the email block: the hardest copy on the screen, answered differently per variant ---- */
function emailCopy(v) {
  if (S.consent === 'suppressed') {
    return '<div class="explain">' +
      '<strong>We couldn&rsquo;t add you back.</strong><br>' +
      'At some point you used the unsubscribe link at the bottom of one of our emails. Our email provider treats that as ' +
      'final, and it won&rsquo;t let us undo it from here &mdash; only you can. It takes about a minute: ' +
      '<a href="' + RESUB + '" target="_blank" rel="noreferrer">add yourself back on their form &#8599;</a>, ' +
      'then press Subscribe again and this message will go away.' +
      '</div>' +
      note('<b>#15:</b> this is a <b>cached observation, not a verdict</b> &mdash; rendered from a local ' +
           '<code>kit_suppressed_at</code>, never from a live Kit call. The Subscribe press below re-reads Kit and clears it.') +
      '<div style="margin-top:var(--space-4)"><button class="btn btn-ghost" data-act="subscribe">Subscribe</button></div>';
  }
  if (S.consent === 'none') {
    return '<p style="line-height:1.7;margin-bottom:var(--space-4)">You said no thanks to our email when you signed up. ' +
      'If you&rsquo;d like it after all &mdash; new tasks, changes in the rules, the occasional thing we learn from ' +
      'another practice &mdash; you can say yes now.</p>' +
      '<button class="btn btn-primary" data-act="subscribe">Subscribe</button>' +
      note('<b>#15:</b> a <b>button, never a checkbox</b>. Email Consent is append-only, and a checkbox implies it toggles back.');
  }
  /* consent granted: the silence where subscription state would be — three different answers */
  if (v === 'A') {
    return '<p style="line-height:1.7">You said yes to our email on <b>3 March 2026</b>.</p>' +
      '<p class="muted tiny" style="margin-top:var(--space-3);line-height:1.7">Every email we send has an unsubscribe link ' +
      'at the bottom. That link is the place to stop them &mdash; it works straight away, and it&rsquo;s the only way, ' +
      'so there&rsquo;s nothing here to switch off.</p>' +
      note('<b>A&rsquo;s answer:</b> state <b>the act and its date</b>, never the status. Says nothing it can&rsquo;t know, ' +
           'and sends withdrawal where withdrawal actually works. Cost: a physician who unsubscribed last year still reads ' +
           '&ldquo;you said yes&rdquo; and may read it as &ldquo;you are subscribed&rdquo;.');
  }
  if (v === 'B') {
    return note('<b>B&rsquo;s answer:</b> there is <b>no email section at all</b> once consent is recorded. The app can&rsquo;t ' +
      'say anything true about subscription state, so it says nothing &mdash; the section exists only while there is an ' +
      'action to offer (Subscribe). Cost: a physician looking for &ldquo;where do I manage email?&rdquo; finds nothing, ' +
      'and absence can read as broken.');
  }
  return '<p style="line-height:1.7;margin-bottom:var(--space-4)">Your email settings live with the service that sends our ' +
    'newsletter, not here. You can change them there any time.</p>' +
    '<a class="btn btn-ghost" href="' + RESUB + '" target="_blank" rel="noreferrer">Manage email preferences &#8599;</a>' +
    note('<b>C&rsquo;s answer:</b> <b>hand the whole question over</b>. No claim, no date, one door out. Cost: the link goes ' +
         'to Kit&rsquo;s resubscribe form, which is not a preference centre &mdash; either that copy is a small lie, or #16 ' +
         'needs a second Kit-hosted page, which is new scope.');
}

function subscribePressed() {
  /* the press re-reads Kit; in the prototype, suppressed clears half the time so both outcomes are reachable */
  if (S.consent === 'suppressed') {
    S.consent = 'granted';
    flash('Kit was re-read and no longer reports you cancelled. You are back on the list.');
  } else {
    S.consent = Math.random() < 0.5 ? 'suppressed' : 'granted';
    flash(S.consent === 'granted' ? 'Thanks — you will get the occasional email.' : 'Kit says this address unsubscribed before.');
  }
}

/* ---- delete / leave: the control lives here, what it does is #18's call ---- */
function accountControls(style) {
  const cls = style === 'quiet' ? 'btn-quiet' : 'btn btn-danger btn-sm';
  if (isOwner()) {
    return '<button class="' + cls + '" data-act="delete">Delete this practice</button>' +
      note('<b>#18</b> owns what this does. #4 already settled the shape: <b>soft delete, purged after 30 days</b>. ' +
           'Open on this screen: does the Owner have a way to delete <i>just themself</i> when the practice has Members? ' +
           'There are no co-owners, so leaving would orphan the list.');
  }
  return '<button class="' + cls + '" data-act="leave">Leave this practice</button>' +
    note('<b>Open question.</b> Nothing in the map says a Member can leave on their own &mdash; #4 and #5 only gave ' +
         'removal to the Owner. Either this control exists (and it is a self-removal, same revocation path as #12), ' +
         'or a Member has to ask. This prototype shows it existing, deliberately, so the choice gets made on purpose.');
}

/* ---- feedback channel: three different homes ---- */
function feedback(v) {
  if (v === 'A') {
    return '<div class="a-sec"><h2>Something wrong on the list?</h2>' +
      '<p class="lede">A task that doesn&rsquo;t make sense, a link that goes nowhere, something missing for ' + esc(PRACTICE.state) + '.</p>' +
      '<a class="btn btn-ghost" href="mailto:admin@directcaretools.com?subject=Launch%20Tasks%20%E2%80%94%20problem%20with%20a%20task">Email us about it</a>' +
      note('<b>A:</b> a <b>mailto</b>. No form, no table, no inbox to build, and the reply lands in a real conversation. ' +
           'Cost: no task context travels with it, and the Admin gets &ldquo;the tax one is wrong&rdquo; with 98 candidates.') +
      '</div>';
  }
  if (v === 'B') {
    return '<h2>Report a problem</h2>' +
      '<p class="muted tiny" style="margin-bottom:var(--space-4)">Wrong instructions, a dead link, something that ' +
      'doesn&rsquo;t apply in ' + esc(PRACTICE.state) + '.</p>' +
      '<label class="tiny muted">Which task?</label>' +
      '<select class="field" style="margin:var(--space-2) 0 var(--space-4)">' +
        '<option>Choose a task&hellip;</option><option>Obtain EIN (Employer Identification Number)</option>' +
        '<option>Register Legal Business Name</option><option>Not about a specific task</option></select>' +
      '<label class="tiny muted">What&rsquo;s wrong?</label>' +
      '<textarea class="field" style="margin-top:var(--space-2);min-height:7rem"></textarea>' +
      '<div style="margin-top:var(--space-4)"><button class="btn btn-primary" data-act="sendfeedback">Send</button></div>' +
      note('<b>B:</b> a <b>form with the task attached</b>. The Admin gets a slug and can act. Cost: a table, a screen to ' +
           'read it, and a reply path &mdash; a small inbox product, for a solo operator who has to answer it. ' +
           'Nothing in #5&rsquo;s admin panel holds this today.');
  }
  return '<div class="c-block"><h2>If something is wrong</h2>' +
    '<p class="c-para">Every task has a <b>&ldquo;this looks wrong&rdquo;</b> link at the bottom of its panel, ' +
    'which tells us which task you meant. If it&rsquo;s not about one task in particular, ' +
    '<a href="mailto:admin@directcaretools.com">email us</a>.</p>' +
    '<div class="c-person" style="align-items:flex-start">' +
      '<div class="grow"><div class="tiny muted" style="text-transform:uppercase;letter-spacing:.08em">In the task drawer, under the links</div>' +
      '<div style="margin-top:var(--space-3);font-size:.9375rem"><a href="#" data-act="reportinline">This looks wrong &rarr;</a></div></div>' +
    '</div>' +
    note('<b>C:</b> the control lives <b>in #3&rsquo;s drawer</b>, at the point of the mistake, and carries the task with it. ' +
         'Costs a change to #3&rsquo;s settled screen and it is the only option that puts a second thing in the drawer footer.') +
    '</div>';
}
</script>
<script>
/* ============================ VARIANT A — one page, plain sections ============================ */
function SettingsA() {
  let h = appbar() + flashBar() + '<div class="wrap narrow">';
  h += '<h1 style="font-size:1.5rem;margin-bottom:var(--space-6)">Settings</h1>';

  h += '<div class="a-sec"><h2>Your practice</h2>' +
    '<p class="lede">Only the name shows up anywhere. Everything else is here so we know what to put on your list.</p>' +
    '<label class="tiny muted">Practice name</label>' +
    '<input class="field" style="margin-top:var(--space-2)" value="' + esc(PRACTICE.name) + '"' + (isOwner() ? '' : ' disabled') + ' />' +
    (isOwner() ? '' : '<p class="tiny muted" style="margin-top:var(--space-2)">Only ' + esc(OWNER.name) + ' can change this.</p>') +
    '<div class="a-row" style="margin-top:var(--space-5)"><div class="grow"><div class="nm">State</div>' +
      '<div class="em">' + esc(PRACTICE.state) + ' &mdash; used to flag the tasks where the rules vary</div></div>' +
      '<button class="btn btn-ghost btn-sm" data-act="changestate">Change</button></div>' +
    note('<b>#6</b> gave the Practice Profile three answers (state, fixed office, employees) and said they are ' +
         '<b>never re-applied</b> to Tasks. So changing state here can only move #3&rsquo;s <i>Varies by state</i> pointer ' +
         'and the Kit field (#13) &mdash; it must not re-run the Tailoring Wizard. The other two answers have no reader ' +
         'after the Wizard: <b>should they be on this screen at all?</b>') +
    '</div>';

  h += '<div class="a-sec"><h2>Who&rsquo;s on this practice</h2>' +
    '<p class="lede">' + seatsUsed() + ' of 3 people. Everyone here can do anything on the task list.</p>';
  roster().forEach((p, i) => {
    h += '<div class="a-row">' +
      '<div class="avatar' + (p.pending ? ' pending' : '') + '">' + esc(initials(p)) + '</div>' +
      '<div class="grow"><div class="nm">' + esc(p.name || p.email) + ' ' +
        (p.role === 'Owner' ? '<span class="pill pill-owner">Owner</span>' : '') +
        (p.pending ? '<span class="pill pill-pending">Invited</span>' : '') +
        (p.email === me().email ? '<span class="pill pill-you">You</span>' : '') + '</div>' +
      '<div class="em">' + (p.name ? esc(p.email) + ' &middot; ' : '') + esc(p.since) +
        (p.pending ? ' &middot; hasn&rsquo;t accepted yet' : '') + '</div></div>' +
      (isOwner() && p.role !== 'Owner'
        ? '<button class="btn-quiet" data-act="remove" data-i="' + i + '">' + (p.pending ? 'Cancel invite' : 'Remove') + '</button>'
        : '') +
      '</div>';
  });
  if (isOwner()) {
    h += atCap()
      ? '<div class="explain" style="margin-top:var(--space-5)">Your practice is full &mdash; three people, including ' +
        'anyone you&rsquo;ve invited who hasn&rsquo;t accepted yet. To add someone else, remove one of them first.</div>' +
        note('<b>#4:</b> <b>pending invites count against the cap</b>, so acceptance can never breach it. The wording has ' +
             'to make that obvious or the Owner will think the app is miscounting.')
      : '<div class="a-invite">' +
        '<input class="field" type="email" placeholder="Their email address" />' +
        '<button class="btn btn-primary" data-act="invite">Send invite</button></div>' +
        '<p class="tiny muted" style="margin-top:var(--space-3)">They&rsquo;ll get an email with a link. Until they use it, ' +
        'they hold one of your three places.</p>' +
        note('<b>Enumeration (#19 &rarr; #20 handover).</b> This box must answer <b>identically</b> whether the address is ' +
             'new, already on this practice, or already on someone else&rsquo;s: always &ldquo;Invite sent&rdquo;, always a ' +
             'pending row. The helpful version &mdash; &ldquo;that person is already in a practice&rdquo; &mdash; hands an ' +
             'Owner an oracle for any address they can think of. <b>The truth goes to the recipient&rsquo;s inbox instead</b> ' +
             '(see the Invite acceptance screen with Notes on).');
  } else {
    h += '<p class="tiny muted" style="margin-top:var(--space-5)">' + esc(OWNER.name) + ' looks after who&rsquo;s on this practice.</p>' +
      note('<b>Member&rsquo;s view.</b> Three of the four controls on this screen aren&rsquo;t theirs. A is showing the ' +
           'roster read-only rather than hiding it &mdash; a Member should be able to see who can read their Notes.');
  }
  h += '</div>';

  const emailSection = emailCopy('A');
  if (emailSection) h += '<div class="a-sec"><h2>Email from us</h2>' + emailSection + '</div>';

  h += feedback('A');

  h += '<div class="a-sec"><h2>Your account</h2>' +
    '<div class="a-row"><div class="grow"><div class="nm">' + esc(me().email) + '</div>' +
    '<div class="em">You sign in with a link we email you. There&rsquo;s no password to change.</div></div>' +
    '<button class="btn btn-ghost btn-sm">Sign out</button></div>' +
    '<div style="margin-top:var(--space-5)">' + accountControls() + '</div></div>';

  return h + '</div>';
}

/* ============================ VARIANT B — settings console, tabbed ============================ */
function SettingsB() {
  const tabs = [['practice','Practice'], ['team','People'], ['email','Email'], ['feedback','Report a problem'], ['account','Account']];
  let h = appbar() + flashBar() + '<div class="wrap"><div class="b-grid">';
  h += '<nav class="b-nav">' + tabs.map(t =>
    '<button data-act="tab" data-tab="' + t[0] + '" aria-current="' + (S.tab === t[0]) + '">' + t[1] + '</button>').join('') + '</nav>';

  if (S.tab === 'practice') {
    h += '<h2>Practice</h2><dl class="b-kv">' +
      '<dt>Name</dt><dd><input class="field" value="' + esc(PRACTICE.name) + '"' + (isOwner() ? '' : ' disabled') + ' /></dd>' +
      '<dt>State</dt><dd>' + esc(PRACTICE.state) + ' <button class="btn-quiet" style="margin-left:var(--space-3)">Change</button></dd>' +
      '<dt>Sees patients at</dt><dd>A fixed office</dd>' +
      '<dt>Expects employees</dt><dd>No, not in the first 6 months</dd>' +
      '<dt>Created</dt><dd>' + esc(PRACTICE.created) + '</dd>' +
      '<dt>People</dt><dd class="b-seats">' + seatsUsed() + ' of 3</dd>' +

      note('<b>This is the console the ticket warns about.</b> Everything true about the Practice, laid out as fields, ' +
           'including the two Tailoring answers that have <b>no reader left</b> once the Wizard has run (#6). Correct, ' +
           'complete, and it reads like software configuration rather than like a clinic.');
  }
  if (S.tab === 'team') {
    h += '<h2>People</h2><table class="b-table"><thead><tr><th>Person</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>';
    roster().forEach((p, i) => {
      h += '<tr><td><b>' + esc(p.name || p.email) + '</b><div class="muted tiny">' + esc(p.email) + '</div></td>' +
        '<td>' + esc(p.role) + '</td>' +
        '<td class="muted">' + (p.pending ? 'Invited' : 'Active') + '</td>' +
        '<td>' + (isOwner() && p.role !== 'Owner'
          ? '<button class="btn btn-ghost btn-sm" data-act="remove" data-i="' + i + '">' + (p.pending ? 'Cancel' : 'Remove') + '</button>' : '') +
        '</td></tr>';
    });
    h += '</tbody></table>';
    h += '<p class="b-seats" style="margin-top:var(--space-4)">Seats used: ' + seatsUsed() + ' / 3 (pending invites included)</p>';
    if (isOwner()) {
      h += '<div class="a-invite">' +
        '<input class="field" type="email" placeholder="email@example.com"' + (atCap() ? ' disabled' : '') + ' />' +
        '<button class="btn btn-primary" data-act="invite"' + (atCap() ? ' disabled' : '') + '>Invite</button></div>' +
        (atCap() ? '<p class="tiny muted" style="margin-top:var(--space-2)">No seats available.</p>' : '') +
        note('B says the cap with a <b>disabled control and the word &ldquo;seats&rdquo;</b>. Compare A, which says it in a ' +
             'sentence and never uses the word. &ldquo;Seat&rdquo; is on the <i>Avoid</i> list in CONTEXT.md, and this is ' +
             'exactly the gravity a table-shaped screen exerts on the vocabulary.');
    }
  }
  if (S.tab === 'email') {
    h += '<h2>Email</h2>';
    const e = emailCopy('B');
    h += e || '<p class="muted">Nothing to manage here.</p>' +
      note('<b>B&rsquo;s answer to the silence:</b> in a tabbed console the tab still exists, so the emptiness is ' +
           '<b>louder</b> than it is on a single page. That is the cost of sub-navigation for a screen whose honest ' +
           'answer is sometimes nothing.');
  }
  if (S.tab === 'feedback') h += feedback('B');
  if (S.tab === 'account') {
    h += '<h2>Account</h2><dl class="b-kv">' +
      '<dt>Email address</dt><dd>' + esc(me().email) + '</dd>' +
      '<dt>Sign-in method</dt><dd>Magic link &mdash; no password</dd>' +
      '<dt>Role</dt><dd>' + esc(me().role) + '</dd></dl>' +
      '<div style="margin-top:var(--space-6);display:flex;gap:var(--space-3);flex-wrap:wrap">' +
      '<button class="btn btn-ghost btn-sm">Sign out</button>' + accountControls() + '</div>';
  }
  return h + '</section></div></div>';
}

/* ============================ VARIANT C — your practice, in sentences ============================ */
function SettingsC() {
  let h = appbar() + flashBar() + '<div class="wrap narrow">';
  h += '<div class="c-head"><h1>' + esc(PRACTICE.name) + '</h1>' +
    '<p>In ' + esc(PRACTICE.state) + ', started ' + esc(PRACTICE.created) + '.</p></div>';

  h += '<div class="c-block"><h2>The practice</h2>' +
    '<p class="c-para">You&rsquo;re opening in <b>' + esc(PRACTICE.state) + '</b>, so we flag the tasks where the rules ' +
    'are different from state to state. <button class="btn-quiet" data-act="changestate">Change that</button></p>' +
    (isOwner() ? '<p class="c-para">The practice is called <b>' + esc(PRACTICE.name) + '</b>. ' +
      '<button class="btn-quiet" data-act="rename">Rename it</button></p>' : '') +
    note('<b>C&rsquo;s bet:</b> there is <b>no Settings screen</b> &mdash; it is a page about the practice, and the controls ' +
         'are verbs inside sentences. The two Tailoring answers with no reader simply aren&rsquo;t here; nothing had to ' +
         'justify leaving a field out, because there are no fields.') +
    '</div>';

  h += '<div class="c-block"><h2>Who&rsquo;s here</h2>';
  h += '<p class="c-para">' + (seatsUsed() === 1
      ? 'It&rsquo;s just you. You can bring in up to two other people &mdash; a partner, a spouse, a practice manager &mdash; and they can do everything on the list that you can.'
      : 'You and ' + (seatsUsed() - 1) + ' other' + (seatsUsed() > 2 ? 's' : '') + '. Everyone here can do everything on the list that you can, and everyone reads the same notes.') + '</p>';
  h += '<div class="c-people">';
  roster().forEach((p, i) => {
    h += '<div class="c-person' + (p.pending ? ' pending' : '') + '">' +
      '<div class="avatar' + (p.pending ? ' pending' : '') + '">' + esc(initials(p)) + '</div>' +
      '<div class="grow"><div style="font-weight:600;color:var(--gray-900)">' + esc(p.name || p.email) +
        (p.email === me().email ? ' <span class="pill pill-you">You</span>' : '') + '</div>' +
      '<div class="tiny muted">' + (p.pending
          ? 'Invited on 14 Sep. Still hasn&rsquo;t opened the link &mdash; it&rsquo;s worth checking their junk folder.'
          : (p.role === 'Owner' ? 'Started this practice' : esc(p.since))) + '</div></div>' +
      (isOwner() && p.role !== 'Owner'
        ? '<button class="btn-quiet" data-act="remove" data-i="' + i + '">' + (p.pending ? 'Cancel' : 'Remove') + '</button>' : '') +
      '</div>';
  });
  h += '</div>';
  if (isOwner()) {
    h += atCap()
      ? '<p class="c-para" style="margin-top:var(--space-5)">That&rsquo;s everyone &mdash; three people is the most a ' +
        'practice can have, and an invite counts even before it&rsquo;s accepted. If you need to bring someone else in, ' +
        'take one of them off first.</p>'
      : '<div class="a-invite" style="margin-top:var(--space-5)">' +
        '<input class="field" type="email" placeholder="Their email address" />' +
        '<button class="btn btn-primary" data-act="invite">Invite them</button></div>' +
        '<p class="tiny muted" style="margin-top:var(--space-3)">We&rsquo;ll email them a link. Nothing happens until they use it.</p>' +
        note('Same enumeration rule as A: <b>one response, always</b>. C is the riskiest place for it, because prose ' +
             'wants to be specific &mdash; &ldquo;Jordan is already on another practice&rdquo; reads beautifully and is the leak.');
  }
  h += '</div>';

  const e = emailCopy('C');
  if (e) h += '<div class="c-block"><h2>Email from us</h2>' + e + '</div>';
  h += feedback('C');

  h += '<div class="c-quiet">' +
    '<span class="muted">Signed in as ' + esc(me().email) + '</span>' +
    '<button>Sign out</button>' + accountControls('quiet') + '</div>';
  return h + '</div>';
}

<script>
/* ============================ invite acceptance ============================ */
/* The one flow that runs against an unauthenticated stranger.
   The variants disagree about ONE thing: how much authority the emailed link carries. */

function inviteHeader() {
  return '<div class="inv-brand">Launch<span>Tasks</span></div>';
}

function deadLink(v) {
  /* used | revoked | full | expired — how specific dare we be? */
  const generic = '<h1>This link doesn&rsquo;t work any more</h1>' +
    '<p>It may already have been used, or ' + esc(INVITER) + ' may have withdrawn it. Ask them to send you another one.</p>' +
    note('<b>A:</b> one message for all four cases, mirroring #19&rsquo;s finding that Better Auth returns a ' +
         '<b>byte-identical</b> <code>INVALID_TOKEN</code> for used / expired / forged / never-existed. Consistent &mdash; ' +
         'but #19 also observed that this makes <b>a re-click indistinguishable from a forgery, to the physician as well ' +
         'as the app</b>, and a re-clicked invite is the common case, not the attack.');
  const specific = {
    used:    ['You&rsquo;ve already joined', 'This invite has been used &mdash; you&rsquo;re a member of ' + esc(PRACTICE.name) + ' already. Sign in and you&rsquo;ll go straight to the list.', 'Sign in'],
    revoked: ['This invite was withdrawn', esc(INVITER) + ' cancelled this invite. If that&rsquo;s a surprise, it&rsquo;s worth a word with them &mdash; we can&rsquo;t reinstate it from here.', null],
    full:    [esc(PRACTICE.name) + ' is full', 'A practice can have three people, and all three places were taken before you opened this. ' + esc(INVITER) + ' can free one up and invite you again.', null],
    expired: ['This link has expired', 'Invite links last 30 days, and this one was sent on 14 September. Ask ' + esc(INVITER) + ' to send a new one &mdash; it takes them a few seconds.', null],
  }[S.invite];
  if (v === 'A') return generic;
  return '<h1>' + specific[0] + '</h1><p>' + specific[1] + '</p>' +
    (specific[2] ? '<div class="inv-actions"><button class="btn btn-primary">' + specific[2] + '</button></div>' : '') +
    note('<b>B and C tell the truth about which case it is.</b> The argument that this is safe: <b>the leak #20 warns about ' +
         'lives in the invite <i>box</i>, not the invite <i>link</i></b> &mdash; whoever opens this URL already holds an ' +
         'unguessable token, so distinguishing &ldquo;used&rdquo; from &ldquo;withdrawn&rdquo; tells them nothing they ' +
         'couldn&rsquo;t already infer. The counter-argument: a <b>forged</b> token must still fall through to the generic ' +
         'message, so this screen needs <b>five</b> answers, not four.');
}

function InviteScreen(v) {
  const invitee = 'jordan.lee@northwoodclinic.com';
  let inner = inviteHeader();

  if (['used','revoked','full','expired'].includes(S.invite)) {
    inner += deadLink(v);
  } else if (S.invite === 'signedin_own' || S.invite === 'signedin_busy') {
    const busy = S.invite === 'signedin_busy';
    inner += '<h1>' + esc(INVITER) + ' invited you to ' + esc(PRACTICE.name) + '</h1>' +
      '<div class="inv-who"><div class="avatar">JL</div><div><div style="font-weight:600;color:var(--gray-900)">' +
        esc(invitee) + '</div><div class="tiny muted">Signed in, on <b>Willow Creek Direct Care</b></div></div></div>';
    if (busy) {
      inner += '<p>You&rsquo;re already using Launch Tasks for <b>Willow Creek Direct Care</b>, and you&rsquo;ve marked ' +
        '<b>14 tasks</b> done there. One person can only be on one practice, so joining ' + esc(PRACTICE.name) + ' would ' +
        'mean giving that up &mdash; and we won&rsquo;t do that to work you&rsquo;ve done.</p>' +
        '<p>If Willow Creek was a false start, delete it first and then open this link again.</p>' +
        '<div class="inv-actions"><button class="btn btn-ghost">Take me to Willow Creek</button></div>' +
        note('<b>#4:</b> one Practice per User (<code>membership.user_id UNIQUE</code>), and acceptance may ' +
             '<b>abandon an invitee&rsquo;s own empty Practice</b>. &ldquo;Empty&rdquo; is doing real work here and ' +
             'nobody has defined it. This prototype reads it as <b>no Task Entry ever touched and no Custom Task</b> ' +
             '&mdash; and deliberately refuses rather than asking &ldquo;are you sure?&rdquo;, because an accidental yes ' +
             'is unrecoverable and the physician can always come back.');
    } else {
      inner += '<p>You started a practice of your own (<b>Willow Creek Direct Care</b>) but haven&rsquo;t touched the ' +
        'list yet. One person is on one practice, so accepting this will put that empty one aside and bring you here.</p>' +
        '<div class="inv-actions"><button class="btn btn-primary">Join ' + esc(PRACTICE.name) + '</button>' +
        '<button class="btn btn-ghost">No thanks</button></div>' +
        note('The <b>signed-up-then-invited</b> case #4 called out. Silence here is what strands two physicians who both ' +
             'registered before either thought to invite the other.');
    }
  } else if (v === 'A') {
    inner += '<h1>' + esc(INVITER) + ' invited you to ' + esc(PRACTICE.name) + '</h1>' +
      '<p>A shared checklist for opening the practice &mdash; 98 tasks, in order, with the fiddly bits explained. ' +
      'It&rsquo;s free, and you&rsquo;ll be able to do everything on it that ' + esc(INVITER) + ' can.</p>' +
      '<div class="inv-who"><div class="avatar pending">JL</div><div><div style="font-weight:600;color:var(--gray-900)">' +
        esc(invitee) + '</div><div class="tiny muted">The address this invite was sent to</div></div></div>' +
      '<div class="inv-actions"><button class="btn btn-primary" data-act="accept">Join the practice</button></div>' +
      note('<b>A: the invite link <i>is</i> the sign-in.</b> One click, no second email &mdash; the invite is a magic link ' +
           'with a join attached, which is the fewest steps and the fewest ways to get lost. What it costs: the link ' +
           'carries <b>full account authority</b>, so a forwarded invite email hands over the account, and the token ' +
           'lives in a mailbox for 30 days rather than #7&rsquo;s short magic-link window. It also inherits #19&rsquo;s ' +
           '<b>prefetch burn</b> &mdash; a scanner that fetches the URL consumes the invite before the physician clicks it.');
  } else if (v === 'B') {
    inner += '<h1>' + esc(INVITER) + ' invited you to ' + esc(PRACTICE.name) + '</h1>' +
      '<p>A shared checklist for opening the practice &mdash; 98 tasks, in order, with the fiddly bits explained. It&rsquo;s free.</p>' +
      '<p>We&rsquo;ll send a sign-in link to <b>' + esc(invitee) + '</b>. Open it and you&rsquo;re in.</p>' +
      '<div class="inv-actions"><button class="btn btn-primary" data-act="sendlink">Email me a sign-in link</button></div>' +
      note('<b>B: the invite link carries no authority at all.</b> It is a public landing page; the <b>second</b> email is ' +
           'the credential, and it is #7&rsquo;s ordinary magic link with its short expiry. Immune to forwarding and to ' +
           'prefetch burn (the accept is a POST). Costs a <b>second email and a second inbox trip</b> &mdash; two ' +
           'deliverability events instead of one &mdash; for a physician who has already been told to check their email once.');
  } else {
    inner += '<h1>' + esc(INVITER) + ' invited you to ' + esc(PRACTICE.name) + '</h1>' +
      '<p>A shared checklist for opening the practice. To make sure this invite reached the right person, type the email ' +
      'address it was sent to and we&rsquo;ll send your sign-in link there.</p>' +
      '<input class="field" type="email" placeholder="you@example.com" style="margin-bottom:var(--space-3)" />' +
      '<div class="inv-actions"><button class="btn btn-primary" data-act="sendlink">Continue</button></div>' +
      note('<b>C: B, plus the address is not shown.</b> A forwarded invite is useless unless the recipient already knows ' +
           'the address it went to, and the reply is identical whether the typed address matches or not. Costs the ' +
           'physician a <b>typing test</b> at the front door &mdash; and a mismatch is indistinguishable from a link that ' +
           'never arrives, which is the worst failure this flow has.');
  }

  /* the invited person's email — where the enumeration truth actually goes */
  let mail = '';
  if (S.notes) {
    mail = '<div class="mail"><header>To: ' + esc(invitee) + ' &middot; From: DirectCareTools &lt;noreply@mail.directcaretools.com&gt;<br>' +
      'Subject: ' + esc(INVITER) + ' invited you to a practice on Launch Tasks</header>' +
      '<div class="mbody"><p>' + esc(INVITER) + ' has invited you to join <b>' + esc(PRACTICE.name) + '</b> on Launch Tasks &mdash; ' +
      'a free checklist for opening a direct primary care practice.</p>' +
      '<p style="margin-top:var(--space-4)"><a href="#">Open the invite &rarr;</a></p>' +
      '<p style="margin-top:var(--space-4);color:var(--gray-500);font-size:.875rem">You&rsquo;re already on a practice of ' +
      'your own. Joining this one means leaving that one behind &mdash; the invite page will explain what happens.</p></div></div>' +
      note('<b>This is where the enumeration answer lands.</b> The invite box told ' + esc(INVITER) + ' nothing. The ' +
           '<b>recipient&rsquo;s own inbox</b> is allowed to know they already have a practice, because it is their fact ' +
           'about themself. The sender learns only that an email was sent.');
  }

  return '<div class="inv-shell"><div><div class="inv-card">' + inner + '</div>' + mail + '</div></div>';
}

/* ============================ removal confirmation ============================ */
function removalCopy(p) {
  if (p.pending) {
    return '<h1 style="font-size:1.25rem">Cancel this invite?</h1>' +
      '<p>The link we emailed <b>' + esc(p.email) + '</b> will stop working. You can invite them again later.</p>';
  }
  return '<h1 style="font-size:1.25rem">Remove ' + esc(p.name) + '?</h1>' +
    '<p>They&rsquo;ll lose access straight away &mdash; the next page they open will ask them to sign in, and they ' +
    'won&rsquo;t be able to.</p>' +
    '<p><b>Nothing they wrote goes with them.</b> The notes and the tasks they added belong to the practice, and they stay ' +
    'exactly where they are.</p>' +
    note('<b>#12:</b> revocation is real and immediate, and &ldquo;immediately&rdquo; honestly means <b>on their next ' +
         'request</b> &mdash; an in-flight page finishes with full authority. Worth one sentence of honesty here, or worth ' +
         'leaving out? <b>Second half is the new decision:</b> nobody had said, on a screen, that a removed Member&rsquo;s ' +
         'Notes and Custom Tasks stay with the Practice. They do (#4 hangs them off the Practice) &mdash; but an Owner ' +
         'hesitating over this button has no way to know that unless it is written here.');
}
</script>
<script>
/* ============================ render ============================ */
let modal = null;   // { html }

function screenHTML() {
  if (S.screen === 'invite') return InviteScreen(S.variant);
  return { A: SettingsA, B: SettingsB, C: SettingsC }[S.variant]();
}

function modalHTML() {
  if (!modal) return '';
  return '<div style="position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:900"></div>' +
    '<div style="position:fixed;z-index:901;top:50%;left:50%;transform:translate(-50%,-50%);width:min(30rem,92vw);' +
    'background:var(--white);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);padding:var(--space-6)">' +
    modal.html +
    '<div style="display:flex;gap:var(--space-3);margin-top:var(--space-6);justify-content:flex-end">' +
    '<button class="btn btn-ghost" data-act="cancelmodal">Keep them</button>' +
    '<button class="btn btn-danger" data-act="confirmmodal">' + (modal.confirm || 'Remove') + '</button></div></div>';
}

function render() {
  document.getElementById('app').innerHTML = screenHTML() + modalHTML();
  renderChrome();
}

function renderChrome() {
  const keys = Object.keys(VARIANTS);
  const seg = (act, opts, cur) => opts.map(o =>
    '<button data-act="' + act + '" data-v="' + o[0] + '" aria-pressed="' + (cur === o[0]) + '">' + o[1] + '</button>').join('');

  let h = '<div class="line">' +
    '<button data-act="prev">&larr;</button>' +
    '<span class="lbl">' + S.variant + ' &mdash; ' + VARIANTS[S.variant] + '</span>' +
    '<button data-act="next">&rarr;</button>' +
    '<span class="cap">Screen</span>' + seg('screen', [['settings','Settings'],['invite','Invite acceptance']], S.screen) +
    '<button data-act="notes" aria-pressed="' + S.notes + '">Notes</button>' +
    '</div>';

  if (S.screen === 'settings') {
    h += '<div class="line">' +
      '<span class="cap">Signed in as</span>' + seg('role', [['owner','Owner'],['member','Member']], S.role) +
      '<span class="cap">Email consent</span>' + seg('consent', [['none','Never given'],['granted','Given'],['suppressed','Suppressed']], S.consent) +
      '<span class="cap">People</span>' + seg('seats', [[1,'1'],[2,'2'],[3,'3 (full)']], S.seats) +
      '</div>';
  } else {
    h += '<div class="line"><span class="cap">The link is opened&hellip;</span>' +
      '<select data-act="invitecase">' + Object.entries(INVITE_CASES).map(([k, v]) =>
        '<option value="' + k + '"' + (S.invite === k ? ' selected' : '') + '>' + v + '</option>').join('') + '</select></div>';
  }
  document.getElementById('chrome').innerHTML = h;
}

/* ============================ events ============================ */
function syncURL() {
  const p = new URLSearchParams(location.search);
  p.set('variant', S.variant); p.set('screen', S.screen);
  history.replaceState(null, '', location.pathname + '?' + p.toString());
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const keys = Object.keys(VARIANTS);

  if (act === 'prev' || act === 'next') {
    const i = keys.indexOf(S.variant);
    S.variant = keys[(i + (act === 'next' ? 1 : keys.length - 1)) % keys.length];
    if (S.variant === 'B') S.tab = S.tab || 'practice';
    syncURL();
  }
  else if (act === 'screen') { S.screen = el.dataset.v; syncURL(); }
  else if (act === 'role')   { S.role = el.dataset.v; if (S.role === 'member' && S.seats < 2) S.seats = 2; }
  else if (act === 'consent'){ S.consent = el.dataset.v; }
  else if (act === 'seats')  { S.seats = Math.max(Number(el.dataset.v), S.role === 'member' ? 2 : 1); }
  else if (act === 'notes')  { S.notes = !S.notes; }
  else if (act === 'tab')    { S.tab = el.dataset.tab; }
  else if (act === 'subscribe') { e.preventDefault(); subscribePressed(); return; }
  else if (act === 'invite') {
    e.preventDefault();
    flash('Invite sent. They hold one of your three places until they accept.');
    return;
  }
  else if (act === 'sendfeedback') { e.preventDefault(); flash('Thanks — we read every one of these.'); return; }
  else if (act === 'remove') {
    e.preventDefault();
    const p = roster()[Number(el.dataset.i)];
    modal = { html: removalCopy(p), confirm: p.pending ? 'Cancel the invite' : 'Remove ' + (p.name || '').split(' ').pop() };
  }
  else if (act === 'cancelmodal') { modal = null; }
  else if (act === 'confirmmodal') { modal = null; S.seats = Math.max(1, S.seats - 1); flash('Done. They no longer have access.'); return; }
  else if (act === 'delete') {
    e.preventDefault();
    modal = { html: '<h1 style="font-size:1.25rem">Delete ' + esc(PRACTICE.name) + '?</h1>' +
      '<p>Everyone loses access, including you. We hold on to it for <b>30 days</b> in case you change your mind &mdash; ' +
      'after that it&rsquo;s gone for good.</p>' +
      note('<b>#18&rsquo;s call</b>, not this ticket&rsquo;s. The only thing #17 settles is that the control lives here ' +
           'and how loud it is. All three variants put it last and none of them call it a &ldquo;danger zone&rdquo;.'),
      confirm: 'Delete the practice' };
  }
  else if (act === 'leave') {
    e.preventDefault();
    modal = { html: '<h1 style="font-size:1.25rem">Leave ' + esc(PRACTICE.name) + '?</h1>' +
      '<p>You&rsquo;ll lose access to the list straight away. Anything you wrote stays with the practice. ' +
      esc(OWNER.name) + ' can invite you back.</p>', confirm: 'Leave' };
  }
  else if (act === 'accept' || act === 'sendlink') { e.preventDefault(); flash('(prototype) — nothing is sent'); return; }
  else if (act === 'changestate' || act === 'rename' || act === 'reportinline') { e.preventDefault(); flash('(prototype) — not wired'); return; }
  else return;

  e.preventDefault();
  render();
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act="invitecase"]');
  if (!el) return;
  S.invite = el.value;
  render();
});

document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const keys = Object.keys(VARIANTS);
  const i = keys.indexOf(S.variant);
  S.variant = keys[(i + (e.key === 'ArrowRight' ? 1 : keys.length - 1)) % keys.length];
  syncURL(); render();
});

render();
</script>
</body>
</html>
